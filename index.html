        <h3>Cash Management System</h3>

        <p>

    <!-- Right Side -->

    <div class="right-panel">

        <form id="loginForm">

            <h2>Login</h2>

            <div class="input-box">

                <label>Username</label>

                <input
                    id="username"
                    type="text">

            </div>

            <div class="input-box">

                <label>Password</label>

                <input
                    id="password"
                    type="password">

            </div>

            <div class="input-box">

                <label>Login As</label>

                <select id="role">

                    <option value="ADMIN">Administrator</option>

                    <option value="BANKING">Banking User</option>

                    <option value="CSC">CSC User</option>

                </select>

            </div>

            <div class="remember">

                <label>

                    <input  id="remember" type="checkbox">

                    Remember Me

                </label>

            </div>

            <button class="login-btn">

                LOGIN

            </button>

            <div id="loginError"></div>

            <div id="currentDateTime"></div>

        </form>

    </div>

</div>
